# Deploy: construye el place y publica una nueva versión en Roblox mediante
# Open Cloud (Place Publishing API). Solo se ejecuta con push a main.
name: Deploy

on:
  push:
    branches: [main]

# SEGURIDAD: mínimo privilegio. Publicar en Roblox no requiere permisos de GitHub.
permissions:
  contents: read

# Nunca dos deploys a la vez; si llegan varios merges seguidos se ejecutan en
# orden y no se cancela uno a medio publicar.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # GitHub Environment "production". Permite:
    #  - guardar los secretos a nivel de entorno (o de repositorio, ambos funcionan),
    #  - exigir aprobación manual o restringir a la rama main (Settings → Environments),
    #  - añadir más adelante un entorno "development" con los MISMOS nombres de
    #    secretos apuntando al Place DEV (ver README).
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Show tool versions
        run: rojo --version

      - name: Lint (Selene)
        run: selene src

      - name: Build place
        run: rojo build default.project.json -o game.rbxlx

      # SEGURIDAD: los secretos se pasan como variables de entorno SOLO a este
      # paso. GitHub enmascara su valor en los logs y el script nunca los imprime.
      - name: Publish to Roblox (Open Cloud)
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        run: ./scripts/publish-place.sh game.rbxlx
